<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Master Embed Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="fortune-embed-page">
    <main class="fortune-phone-shell">
      <section class="fortune-screen" aria-label="Fortune Master runtime embed demo">
        <header class="fortune-topbar">
          <strong class="fortune-brand">◇ Fortune Master</strong>
          <div class="fortune-status">
            <span>◇ 1,830</span>
            <button type="button" aria-label="알림">⌁</button>
            <button type="button" id="fortuneRuntimeRestart">↻</button>
          </div>
        </header>

        <div class="fortune-runtime-check" aria-live="polite">
          <span>runtime</span>
          <strong id="fortuneRuntimeStatus">booting</strong>
        </div>

        <section class="fortune-hero">
          <p>안녕하세요,</p>
          <h1>스텔라 입니다.</h1>
          <p>당신에게 소중한 메시지를 전해드릴게요.</p>
          <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="consult">
            스텔라와 상담하기
          </button>
        </section>

        <section class="fortune-nanika-mount" id="fortuneNanikaRuntime">
          <div class="fortune-nanika-stage character-stage" aria-label="Stella Nanika runtime">
            <div class="fortune-nanika-speech speech-balloon" role="status" aria-live="polite">
              <span class="fortune-nanika-speaker">스텔라</span>
              <p class="fortune-nanika-text"></p>
              <div class="fortune-nanika-actions balloon-action-menu" hidden></div>
            </div>
            <button class="fortune-nanika-sprite character-sprite" type="button" aria-label="스텔라">
              <img class="fortune-nanika-sprite-image character-sprite-layer" alt="" />
            </button>
            <div class="fortune-nanika-panel management-panel-menu" hidden></div>
          </div>
        </section>

        <section class="fortune-feature-section">
          <div class="fortune-section-title">
            <h2>어떤 운세를 볼까요?</h2>
            <button type="button" data-fortune-page="zodiac" data-fortune-event="fortune:zodiac:open">전체보기 ›</button>
          </div>
          <div class="fortune-card-row">
            <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="omikuji">
              <span>⌘</span>
              오미쿠지
            </button>
            <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="tarot">
              <span>▣</span>
              타로
            </button>
            <button type="button" data-fortune-event="zodiac:selected" data-fortune-value="aries">
              <span>♈</span>
              별자리
            </button>
            <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="daily">
              <span>✦</span>
              데별
            </button>
          </div>
        </section>

        <nav class="fortune-tabbar" aria-label="하단 메뉴">
          <button type="button" data-fortune-event="fortune:home:open">⌂<span>홈</span></button>
          <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="record">ϟ<span>기록</span></button>
          <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="shop">▤<span>상점</span></button>
          <button type="button" data-fortune-event="fortune:menu:selected" data-fortune-value="my">♙<span>마이</span></button>
        </nav>
      </section>
    </main>

    <script type="module" src="./dist/fortuneEmbedDemo.js"></script>
  </body>
</html>
