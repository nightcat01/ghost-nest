<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostNest Menu Builder Vision</title>
    <style>
      :root {
        --bg: #f6f2ea;
        --panel: rgba(255, 253, 248, 0.9);
        --panel-solid: #fffdf8;
        --ink: #241f1a;
        --muted: #756b60;
        --line: rgba(36, 31, 26, 0.12);
        --accent: #347f79;
        --accent-strong: #175d57;
        --accent-soft: #e7f4ef;
        --warn: #b66a2b;
        --danger: #a94737;
        --shadow: 0 18px 48px rgba(36, 31, 26, 0.12);
        font-family:
          Pretendard,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(52, 127, 121, 0.06) 1px, transparent 1px),
          linear-gradient(180deg, rgba(52, 127, 121, 0.04) 1px, transparent 1px),
          radial-gradient(circle at 78% 12%, rgba(52, 127, 121, 0.1), transparent 26rem),
          var(--bg);
        background-size: 34px 34px, 34px 34px, auto, auto;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .menu-vision-shell {
        height: 100vh;
        overflow: hidden;
        min-height: 100vh;
        padding: 16px;
      }

      .menu-vision-topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 253, 248, 0.92);
        box-shadow: 0 12px 32px rgba(36, 31, 26, 0.08);
        backdrop-filter: blur(12px);
      }

      .menu-vision-title {
        min-width: 0;
      }

      .menu-vision-title small {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .menu-vision-title h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        line-height: 1.08;
      }

      .menu-vision-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: end;
      }

      .menu-vision-button {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 13px;
        border-radius: 8px;
        color: #fff;
        background: var(--accent);
        font-weight: 900;
        white-space: nowrap;
      }

      .menu-vision-button.secondary {
        border: 1px solid var(--line);
        color: var(--accent-strong);
        background: rgba(255, 255, 255, 0.75);
      }

      .menu-vision-button.danger {
        background: var(--danger);
      }

      .menu-vision-layout {
        height: calc(100vh - 136px);
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(240px, 0.7fr) minmax(520px, 1.45fr) minmax(300px, 0.85fr);
        gap: 14px;
        align-items: stretch;
        margin-top: 14px;
      }

      .menu-vision-panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .menu-vision-panel-header {
        display: flex;
        gap: 10px;
        align-items: start;
        justify-content: space-between;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line);
      }

      .menu-vision-panel-header h2 {
        margin: 0;
        font-size: 1.04rem;
      }

      .menu-vision-panel-header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .menu-vision-chip {
        flex: 0 0 auto;
        min-height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 9px;
        border-radius: 999px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 0.76rem;
        font-weight: 900;
      }

      .menu-vision-library {
        max-height: 100%;
        overflow: auto;
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .menu-vision-library-panel,
      .menu-vision-builder-panel {
        display: flex;
        flex-direction: column;
      }

      .menu-vision-library-panel .menu-vision-panel-header,
      .menu-vision-builder-panel .menu-vision-panel-header {
        flex: 0 0 auto;
      }

      .menu-vision-palette {
        display: grid;
        gap: 8px;
      }

      .menu-vision-palette h3,
      .menu-vision-section-title {
        margin: 0 0 2px;
        color: var(--accent-strong);
        font-size: 0.82rem;
        font-weight: 900;
      }

      .menu-vision-template {
        width: 100%;
        display: grid;
        gap: 3px;
        padding: 10px;
        border: 1px solid rgba(52, 127, 121, 0.18);
        border-radius: 8px;
        color: var(--ink);
        text-align: left;
        background: rgba(255, 255, 255, 0.74);
      }

      .menu-vision-template strong {
        font-size: 0.9rem;
      }

      .menu-vision-template span {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .menu-vision-template:hover,
      .menu-vision-template.active {
        border-color: rgba(52, 127, 121, 0.48);
        background: var(--accent-soft);
      }

      .menu-vision-menu-meta {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.46);
      }

      .menu-vision-meta-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
        gap: 10px;
      }

      .menu-vision-field {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .menu-vision-field input,
      .menu-vision-field select,
      .menu-vision-field textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.85);
      }

      .menu-vision-field input,
      .menu-vision-field select {
        min-height: 36px;
        padding: 0 10px;
      }

      .menu-vision-field textarea {
        min-height: 68px;
        resize: vertical;
        padding: 9px 10px;
      }

      .menu-vision-builder-body {
        min-height: 0;
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(260px, 0.75fr);
        gap: 12px;
        padding: 12px;
        overflow: hidden;
      }

      .menu-vision-tree-area,
      .menu-vision-preview-area {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
        align-content: start;
      }

      .menu-vision-tree-area > div {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
      }

      .menu-vision-tree {
        min-height: 0;
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 8px;
        padding-right: 4px;
      }

      .menu-vision-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 48px;
        padding: 8px;
        border: 1px solid rgba(36, 31, 26, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
      }

      .menu-vision-item[data-selected="true"] {
        border-color: rgba(52, 127, 121, 0.72);
        background: var(--accent-soft);
        box-shadow: 0 0 0 2px rgba(52, 127, 121, 0.12);
      }

      .menu-vision-item[data-depth="1"] {
        margin-left: 28px;
      }

      .menu-vision-item[data-depth="2"] {
        margin-left: 56px;
      }

      .menu-vision-handle {
        width: 24px;
        height: 30px;
        border-radius: 7px;
        color: var(--muted);
        background: rgba(36, 31, 26, 0.06);
        font-weight: 900;
      }

      .menu-vision-item-title {
        min-width: 0;
        text-align: left;
      }

      .menu-vision-item-title strong,
      .menu-vision-item-title span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-vision-item-title strong {
        font-size: 0.9rem;
      }

      .menu-vision-item-title span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .menu-vision-mini-actions {
        display: flex;
        gap: 4px;
      }

      .menu-vision-icon-button {
        min-width: 30px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--accent-strong);
        background: rgba(255, 255, 255, 0.82);
        font-weight: 900;
      }

      .menu-vision-quick-add {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .menu-vision-quick-add button {
        min-height: 34px;
        border-radius: 8px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 0.8rem;
        font-weight: 900;
      }

      .menu-vision-runtime-preview {
        height: 100%;
        min-height: 280px;
        display: grid;
        align-content: end;
        gap: 10px;
        padding: 14px;
        border: 1px solid rgba(36, 31, 26, 0.12);
        border-radius: 10px;
        background:
          radial-gradient(circle at 50% 24%, rgba(255, 245, 218, 0.42), transparent 26%),
          linear-gradient(180deg, #2d2354, #110d25);
        color: #fff;
        overflow: hidden;
      }

      .menu-vision-character-placeholder {
        justify-self: center;
        width: min(60%, 170px);
        aspect-ratio: 0.72;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(255, 245, 218, 0.4);
        border-radius: 999px 999px 18px 18px;
        color: rgba(255, 245, 218, 0.78);
        background: rgba(255, 255, 255, 0.08);
        font-weight: 900;
      }

      .menu-vision-runtime-menu {
        display: grid;
        gap: 7px;
      }

      .menu-vision-runtime-menu button {
        min-height: 42px;
        padding: 0 13px;
        border: 1px solid rgba(245, 220, 155, 0.24);
        border-radius: 10px;
        color: #ffe7b0;
        text-align: left;
        background: rgba(30, 16, 38, 0.78);
        font-weight: 900;
      }

      .menu-vision-side {
        position: sticky;
        top: 108px;
        display: grid;
        gap: 12px;
        max-height: 100%;
        overflow: auto;
      }

      .menu-vision-inspector {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .menu-vision-inspector-empty {
        margin: 0;
        padding: 18px;
        border: 1px dashed rgba(52, 127, 121, 0.28);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(235, 248, 244, 0.58);
        line-height: 1.55;
      }

      .menu-vision-action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .menu-vision-plain-button {
        min-height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-weight: 900;
      }

      .menu-vision-json {
        max-height: 240px;
        overflow: auto;
        margin: 0;
        padding: 10px;
        border-radius: 8px;
        color: #dff7ef;
        background: #1d2d2a;
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .menu-vision-helper {
        display: grid;
        gap: 8px;
        padding: 12px;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.55;
      }

      .menu-vision-helper strong {
        color: var(--accent-strong);
      }

      @media (max-width: 1180px) {
        .menu-vision-layout {
          grid-template-columns: minmax(230px, 0.72fr) minmax(0, 1.28fr);
        }

        .menu-vision-side {
          position: static;
          grid-column: 1 / -1;
          max-height: none;
        }
      }

      @media (max-width: 820px) {
        .menu-vision-shell {
          padding: 10px;
        }

        .menu-vision-topbar,
        .menu-vision-layout,
        .menu-vision-builder-body,
        .menu-vision-meta-grid {
          grid-template-columns: 1fr;
        }

        .menu-vision-actions {
          justify-content: start;
        }

        .menu-vision-quick-add {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="menu-vision-shell">
      <header class="menu-vision-topbar">
        <div class="menu-vision-title">
          <small>Nanika menu material</small>
          <h1>메뉴 빌더 Vision</h1>
        </div>
        <nav class="menu-vision-actions" aria-label="화면 이동">
          <a class="menu-vision-button secondary" href="./dev-menu-settings.html">기존 화면</a>
          <a class="menu-vision-button secondary" href="./dev-menu-settings-studio.html">Studio 화면</a>
          <button class="menu-vision-button" id="visionSaveButton" type="button">메뉴 저장</button>
        </nav>
      </header>

      <section class="menu-vision-layout">
        <aside class="menu-vision-panel menu-vision-library-panel">
          <header class="menu-vision-panel-header">
            <div>
              <h2>메뉴 재료</h2>
              <p>새 메뉴의 출발점과 자주 쓰는 항목을 고릅니다.</p>
            </div>
            <span class="menu-vision-chip">1</span>
          </header>

          <div class="menu-vision-library">
            <section class="menu-vision-palette" aria-label="메뉴 템플릿">
              <h3>시작 템플릿</h3>
              <button class="menu-vision-template active" type="button" data-template="user">
                <strong>사용자 메뉴</strong>
                <span>대화, 안내, 이동처럼 사용자에게 보이는 메뉴입니다.</span>
              </button>
              <button class="menu-vision-template" type="button" data-template="developer">
                <strong>개발자 메뉴</strong>
                <span>설정, 진단, 로그처럼 관리자가 확인하는 메뉴입니다.</span>
              </button>
              <button class="menu-vision-template" type="button" data-template="compact">
                <strong>작은 메뉴</strong>
                <span>말풍선 안에서 짧게 쓰는 2단 메뉴입니다.</span>
              </button>
            </section>

            <section class="menu-vision-palette" aria-label="빠른 항목 추가">
              <h3>빠른 항목</h3>
              <div class="menu-vision-quick-add">
                <button type="button" data-add-kind="dialogue">대화</button>
                <button type="button" data-add-kind="link">이동</button>
                <button type="button" data-add-kind="submenu">하위 메뉴</button>
              </div>
            </section>

            <section class="menu-vision-palette" aria-label="저장된 메뉴">
              <h3>저장된 메뉴</h3>
              <button class="menu-vision-template" type="button" data-load-sample="fortune">
                <strong>운세 상담 메뉴</strong>
                <span>대화 시작, 안내 받기, 다른 메뉴 열기</span>
              </button>
              <button class="menu-vision-template" type="button" data-load-sample="admin">
                <strong>관리 메뉴</strong>
                <span>대사창, 캐릭터, 런타임 진단</span>
              </button>
            </section>
          </div>
        </aside>

        <section class="menu-vision-panel menu-vision-builder-panel">
          <header class="menu-vision-panel-header">
            <div>
              <h2>메뉴 구조</h2>
              <p>사용자가 보게 될 순서와 깊이를 이 영역에서 바로 확인합니다.</p>
            </div>
            <span class="menu-vision-chip">2</span>
          </header>

          <section class="menu-vision-menu-meta" aria-label="메뉴 기본 정보">
            <div class="menu-vision-meta-grid">
              <label class="menu-vision-field">
                메뉴 이름
                <input id="visionMenuName" value="새 사용자 메뉴" />
              </label>
              <label class="menu-vision-field">
                표시 방식
                <select id="visionDisplayMode">
                  <option value="balloon">말풍선 메뉴</option>
                  <option value="panel">고정 패널</option>
                  <option value="overlay">오버레이</option>
                </select>
              </label>
            </div>
            <label class="menu-vision-field">
              설명
              <textarea id="visionMenuDescription">사용자가 나니카와 대화할 때 선택하는 기본 메뉴입니다.</textarea>
            </label>
          </section>

          <div class="menu-vision-builder-body">
            <section class="menu-vision-tree-area">
              <div>
                <p class="menu-vision-section-title">트리 편집</p>
                <div class="menu-vision-tree" id="visionTree" aria-live="polite"></div>
              </div>
            </section>

            <section class="menu-vision-preview-area">
              <p class="menu-vision-section-title">런타임 미리보기</p>
              <div class="menu-vision-runtime-preview" aria-label="나니카 메뉴 미리보기">
                <div class="menu-vision-character-placeholder">Nanika</div>
                <div class="menu-vision-runtime-menu" id="visionRuntimePreview"></div>
              </div>
            </section>
          </div>
        </section>

        <aside class="menu-vision-side">
          <section class="menu-vision-panel">
            <header class="menu-vision-panel-header">
              <div>
                <h2>선택 항목</h2>
                <p>트리에서 항목을 누르면 여기서 라벨과 실행 동작을 바꿉니다.</p>
              </div>
              <span class="menu-vision-chip">3</span>
            </header>
            <form class="menu-vision-inspector" id="visionInspector">
              <p class="menu-vision-inspector-empty" id="visionEmptyState">왼쪽 트리에서 메뉴 항목을 선택하세요.</p>
              <label class="menu-vision-field">
                라벨
                <input id="visionItemLabel" />
              </label>
              <label class="menu-vision-field">
                항목 종류
                <select id="visionItemType">
                  <option value="dialogue">대화 실행</option>
                  <option value="link">페이지 이동</option>
                  <option value="submenu">다른 메뉴 열기</option>
                  <option value="custom">직접 지정</option>
                </select>
              </label>
              <label class="menu-vision-field">
                실행 값
                <input id="visionItemValue" />
              </label>
              <label class="menu-vision-field">
                설명
                <textarea id="visionItemDescription"></textarea>
              </label>
              <div class="menu-vision-action-row">
                <button class="menu-vision-button" type="submit">항목 반영</button>
                <button class="menu-vision-button danger" id="visionDeleteItemButton" type="button">삭제</button>
              </div>
            </form>
          </section>

          <section class="menu-vision-panel">
            <header class="menu-vision-panel-header">
              <div>
                <h2>개발자 보기</h2>
                <p>저장될 메뉴 데이터는 접어서 확인합니다.</p>
              </div>
              <span class="menu-vision-chip">4</span>
            </header>
            <details class="menu-vision-helper">
              <summary><strong>JSON 확인</strong></summary>
              <pre class="menu-vision-json" id="visionJsonOutput"></pre>
            </details>
          </section>
        </aside>
      </section>
    </main>

    <script>
      const samples = {
        user: {
          id: "menu.user.friendly",
          name: "새 사용자 메뉴",
          displayMode: "balloon",
          description: "사용자가 나니카와 대화할 때 선택하는 기본 메뉴입니다.",
          items: [
            {
              id: "talk",
              label: "나니카와 이야기하기",
              type: "dialogue",
              value: "dialogue.open",
              description: "현재 캐릭터의 대화 메뉴를 엽니다.",
              children: []
            },
            {
              id: "guide",
              label: "안내 받기",
              type: "dialogue",
              value: "dialogue.guide",
              description: "현재 화면에서 할 수 있는 일을 알려줍니다.",
              children: []
            },
            {
              id: "more",
              label: "더 보기",
              type: "submenu",
              value: "menu.more",
              description: "추가 메뉴를 엽니다.",
              children: [
                {
                  id: "help",
                  label: "도움말",
                  type: "dialogue",
                  value: "dialogue.help",
                  description: "도움말 대사를 실행합니다.",
                  children: []
                }
              ]
            }
          ]
        },
        developer: {
          id: "menu.developer.tools",
          name: "개발자 메뉴",
          displayMode: "panel",
          description: "개발자가 런타임 상태를 확인하는 메뉴입니다.",
          items: [
            {
              id: "layout",
              label: "레이아웃 진단",
              type: "custom",
              value: "diagnostics.layout",
              description: "런타임 박스와 viewport 상태를 확인합니다.",
              children: []
            },
            {
              id: "speech",
              label: "대사창 설정",
              type: "custom",
              value: "settings.speech",
              description: "대사창 배치와 크기를 조정합니다.",
              children: []
            }
          ]
        },
        compact: {
          id: "menu.compact.balloon",
          name: "작은 말풍선 메뉴",
          displayMode: "balloon",
          description: "좁은 말풍선 안에서 쓰는 짧은 메뉴입니다.",
          items: [
            {
              id: "one",
              label: "한마디",
              type: "dialogue",
              value: "dialogue.short",
              description: "짧은 대사를 말합니다.",
              children: []
            },
            {
              id: "close",
              label: "닫기",
              type: "custom",
              value: "menu.close",
              description: "메뉴를 닫습니다.",
              children: []
            }
          ]
        },
        fortune: {
          id: "menu.fortune.consult",
          name: "운세 상담 메뉴",
          displayMode: "panel",
          description: "상담형 화면에서 사용하는 메뉴입니다.",
          items: [
            {
              id: "fortune-talk",
              label: "운세 상담 시작",
              type: "dialogue",
              value: "fortune.start",
              description: "상담 시작 대사를 실행합니다.",
              children: []
            },
            {
              id: "zodiac",
              label: "별자리 보기",
              type: "link",
              value: "/zodiac",
              description: "별자리 선택 화면으로 이동합니다.",
              children: []
            },
            {
              id: "deck",
              label: "타로 카드",
              type: "link",
              value: "/tarot",
              description: "타로 화면으로 이동합니다.",
              children: []
            }
          ]
        },
        admin: {
          id: "menu.admin.runtime",
          name: "관리 메뉴",
          displayMode: "panel",
          description: "런타임 확인용 관리 메뉴입니다.",
          items: [
            {
              id: "speech-layout",
              label: "대사창 배치",
              type: "custom",
              value: "settings.speech.layout",
              description: "대사창 배치를 바꿉니다.",
              children: []
            },
            {
              id: "character-switch",
              label: "캐릭터 변경",
              type: "custom",
              value: "runtime.character.switch",
              description: "현재 캐릭터를 바꿉니다.",
              children: []
            },
            {
              id: "scene-toggle",
              label: "무대 켜기",
              type: "custom",
              value: "runtime.scene.toggle",
              description: "무대 조합 표시 상태를 바꿉니다.",
              children: []
            }
          ]
        }
      };

      const quickItems = {
        dialogue: {
          label: "새 대화",
          type: "dialogue",
          value: "dialogue.new",
          description: "새 대사 액션을 실행합니다."
        },
        link: {
          label: "새 이동",
          type: "link",
          value: "/path",
          description: "지정한 페이지로 이동합니다."
        },
        submenu: {
          label: "새 하위 메뉴",
          type: "submenu",
          value: "menu.next",
          description: "다른 메뉴를 엽니다."
        }
      };

      const state = {
        menu: structuredClone(samples.user),
        selectedId: "talk"
      };

      const tree = document.querySelector("#visionTree");
      const preview = document.querySelector("#visionRuntimePreview");
      const jsonOutput = document.querySelector("#visionJsonOutput");
      const menuName = document.querySelector("#visionMenuName");
      const displayMode = document.querySelector("#visionDisplayMode");
      const menuDescription = document.querySelector("#visionMenuDescription");
      const emptyState = document.querySelector("#visionEmptyState");
      const labelInput = document.querySelector("#visionItemLabel");
      const typeInput = document.querySelector("#visionItemType");
      const valueInput = document.querySelector("#visionItemValue");
      const descriptionInput = document.querySelector("#visionItemDescription");
      const deleteButton = document.querySelector("#visionDeleteItemButton");

      function flatten(items, depth = 0, result = []) {
        for (const item of items) {
          result.push({ item, depth });
          flatten(item.children || [], depth + 1, result);
        }
        return result;
      }

      function findItem(id, items = state.menu.items) {
        for (const item of items) {
          if (item.id === id) return item;
          const child = findItem(id, item.children || []);
          if (child) return child;
        }
        return null;
      }

      function removeItem(id, items = state.menu.items) {
        const index = items.findIndex((item) => item.id === id);
        if (index >= 0) {
          items.splice(index, 1);
          return true;
        }
        return items.some((item) => removeItem(id, item.children || []));
      }

      function makeId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 7)}`;
      }

      function updateInspector() {
        const selected = findItem(state.selectedId);
        const disabled = !selected;
        emptyState.hidden = !disabled;
        labelInput.disabled = disabled;
        typeInput.disabled = disabled;
        valueInput.disabled = disabled;
        descriptionInput.disabled = disabled;
        deleteButton.disabled = disabled;
        if (!selected) {
          labelInput.value = "";
          valueInput.value = "";
          descriptionInput.value = "";
          return;
        }
        labelInput.value = selected.label;
        typeInput.value = selected.type;
        valueInput.value = selected.value;
        descriptionInput.value = selected.description;
      }

      function renderTree() {
        tree.innerHTML = "";
        for (const { item, depth } of flatten(state.menu.items)) {
          const row = document.createElement("article");
          row.className = "menu-vision-item";
          row.dataset.depth = String(Math.min(depth, 2));
          row.dataset.selected = String(item.id === state.selectedId);
          row.innerHTML = `
            <button class="menu-vision-handle" type="button" aria-label="정렬 핸들">::</button>
            <button class="menu-vision-item-title" type="button">
              <strong></strong>
              <span></span>
            </button>
            <span class="menu-vision-mini-actions">
              <button class="menu-vision-icon-button" type="button" data-action="child" title="하위 항목 추가">+</button>
            </span>
          `;
          row.querySelector("strong").textContent = item.label;
          row.querySelector(".menu-vision-item-title span").textContent = `${item.type} / ${item.value}`;
          row.querySelector(".menu-vision-item-title").addEventListener("click", () => {
            state.selectedId = item.id;
            render();
          });
          row.querySelector('[data-action="child"]').addEventListener("click", () => {
            item.children = item.children || [];
            const next = {
              id: makeId("child"),
              label: "새 하위 항목",
              type: "dialogue",
              value: "dialogue.child",
              description: "상위 항목 아래에서 실행됩니다.",
              children: []
            };
            item.children.push(next);
            state.selectedId = next.id;
            render();
          });
          tree.append(row);
        }
      }

      function renderPreview() {
        preview.innerHTML = "";
        const visibleItems = state.menu.items.slice(0, 4);
        for (const item of visibleItems) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.label;
          preview.append(button);
        }
      }

      function renderJson() {
        jsonOutput.textContent = JSON.stringify(state.menu, null, 2);
      }

      function render() {
        menuName.value = state.menu.name;
        displayMode.value = state.menu.displayMode;
        menuDescription.value = state.menu.description;
        renderTree();
        renderPreview();
        renderJson();
        updateInspector();
      }

      function loadMenu(sample) {
        state.menu = structuredClone(sample);
        state.selectedId = state.menu.items[0]?.id || null;
        render();
      }

      document.querySelectorAll("[data-template]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-template]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          loadMenu(samples[button.dataset.template]);
        });
      });

      document.querySelectorAll("[data-load-sample]").forEach((button) => {
        button.addEventListener("click", () => loadMenu(samples[button.dataset.loadSample]));
      });

      document.querySelectorAll("[data-add-kind]").forEach((button) => {
        button.addEventListener("click", () => {
          const seed = quickItems[button.dataset.addKind];
          const next = {
            id: makeId(seed.type),
            label: seed.label,
            type: seed.type,
            value: seed.value,
            description: seed.description,
            children: []
          };
          state.menu.items.push(next);
          state.selectedId = next.id;
          render();
        });
      });

      menuName.addEventListener("input", () => {
        state.menu.name = menuName.value;
        renderJson();
      });

      displayMode.addEventListener("change", () => {
        state.menu.displayMode = displayMode.value;
        renderJson();
      });

      menuDescription.addEventListener("input", () => {
        state.menu.description = menuDescription.value;
        renderJson();
      });

      document.querySelector("#visionInspector").addEventListener("submit", (event) => {
        event.preventDefault();
        const selected = findItem(state.selectedId);
        if (!selected) return;
        selected.label = labelInput.value || "이름 없는 항목";
        selected.type = typeInput.value;
        selected.value = valueInput.value;
        selected.description = descriptionInput.value;
        render();
      });

      deleteButton.addEventListener("click", () => {
        if (!state.selectedId) return;
        removeItem(state.selectedId);
        state.selectedId = state.menu.items[0]?.id || null;
        render();
      });

      document.querySelector("#visionSaveButton").addEventListener("click", () => {
        alert("컨셉 화면입니다. 실제 저장은 기존 메뉴 설정 화면과 연결한 뒤 활성화합니다.");
      });

      render();
    </script>
  </body>
</html>
